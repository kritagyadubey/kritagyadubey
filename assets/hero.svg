<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Kritagya — Python prompt panel</title>
  <desc id="heroDesc">A dark terminal-style panel showing the prompt &gt;&gt;&gt; import kritagya with a blinking block cursor and the comment one traceback at a time, beside a large grey-and-blue K monogram.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0E13"/>
      <stop offset="0.6" stop-color="#111820"/>
      <stop offset="1" stop-color="#0D131B"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#8B949E" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4B8BBE" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#4B8BBE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="960" height="260" rx="14" fill="url(#bg)"/>
  <rect width="960" height="260" rx="14" fill="url(#grid)"/>
  <rect width="960" height="260" rx="14" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="959" height="259" rx="13.5" fill="none" stroke="#30363D"/>

  <g fill="none" stroke-linecap="butt" stroke-linejoin="round" stroke-width="16">
    <path d="M756 40 V220" stroke="#ADBAC7" stroke-opacity="0.9"/>
    <path d="M900 40 L756 130 L900 220" stroke="#4B8BBE"/>
  </g>

  <rect x="72" y="62" width="420" height="2" fill="#30363D"/>
  <rect x="72" y="62" width="104" height="2" fill="#4B8BBE"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="46" font-weight="600" fill="#E6EDF3">
    <text x="72" y="150" fill-opacity="0.95">&gt;&gt;&gt; import kritagya <tspan fill="#4B8BBE">&#9608;</tspan></text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="28" fill="#8B949E">
    <text x="72" y="204" fill-opacity="0.8"># one traceback at a time</text>
  </g>
</svg>
